@font-face {
  font-family: serif-placeholder;
  src: local(Georgia);
}
:root {
  font-family: "DM Sans", sans-serif;
  color: #fff2de;
  color-scheme: dark;
  font-size: 15px;
  --cream: #fff2de;
  --gold: #f7d59a;
  --violet: #c9b4ee;
  --ink: #2c233b;
  --serif: "DM Serif Text", Georgia, serif;
}
* {
  box-sizing: border-box;
}
html,
body,
#game,
#viewport {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #161c29;
}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}
button:focus-visible {
  outline: 3px solid #ffe2a1;
  outline-offset: 4px;
}
[hidden] {
  display: none !important;
}
#game {
  position: relative;
}
#viewport,
canvas,
.vignette,
#fade,
#eyelids,
#flash,
#curtain {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
canvas {
  display: block;
}
.vignette {
  pointer-events: none;
  box-shadow: inset 0 0 15vw #19152862;
  background: linear-gradient(
    #17162b70,
    transparent 23%,
    transparent 65%,
    #17112699
  );
}
header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: clamp(18px, 3vw, 36px) clamp(20px, 5vw, 64px);
  pointer-events: none;
  z-index: 2;
}
.wordmark {
  font: 400 21px var(--serif);
  letter-spacing: -0.025em;
  text-shadow: 0 2px 12px #171324;
}
.tools {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}
.tools button {
  border: 1px solid #fff2da44;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  background: #30243e9c;
  backdrop-filter: blur(10px);
  font-size: 18px;
}
#dialog {
  position: absolute;
  z-index: 4;
  bottom: clamp(28px, 5vh, 62px);
  left: 50%;
  transform: translateX(-50%);
  width: min(790px, calc(100% - 40px));
  border: 1px solid #eed1a167;
  background: linear-gradient(130deg, #31253bef, #29253be8);
  border-radius: 20px;
  padding: 24px 30px 26px;
  box-shadow: 0 18px 54px #14102165;
  backdrop-filter: blur(13px);
}
#speaker {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--gold);
}
h1 {
  font: 400 clamp(24px, 3.1vw, 39px)/1.1 var(--serif);
  letter-spacing: -0.026em;
  margin: 10px 0 0;
  text-wrap: pretty;
}
#detail {
  font-size: 14px;
  color: #e9dacb;
  margin: 13px 0 0;
  max-width: 54ch;
}
#choices {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
}
#choices button,
#curtain-message button {
  border: 1px solid #f0d8b568;
  border-radius: 30px;
  padding: 11px 18px;
  min-height: 43px;
  background: #fff4d80b;
  text-align: left;
  transition:
    transform 0.15s,
    background 0.15s;
}
#choices button:first-child,
#curtain-message button {
  background: #ffe1ac;
  color: #39243c;
  border-color: #ffe1ac;
  font-weight: 650;
}
#choices button:hover,
#curtain-message button:hover {
  transform: translateY(-2px);
  background: #dfc9f3;
  color: #33233c;
}
#game[data-mode="opening"] #dialog {
  bottom: 23%;
  width: min(640px, calc(100% - 48px));
  background: transparent;
  border: 0;
  box-shadow: none;
  text-align: center;
  backdrop-filter: none;
}
#game[data-mode="opening"] h1 {
  font-size: clamp(55px, 8.3vw, 110px);
  line-height: 0.9;
  letter-spacing: -0.054em;
}
#game[data-mode="opening"] #detail {
  margin: 20px auto 0;
  color: #efdcc7;
  font-size: 16px;
}
#game[data-mode="opening"] #choices {
  justify-content: center;
  margin-top: 26px;
}
#game[data-mode="proposal"] h1 {
  font-size: clamp(21px, 2.3vw, 30px);
  line-height: 1.13;
}
#game[data-mode="proposal"] #dialog {
  left: clamp(20px, 5vw, 64px);
  transform: none;
  width: min(520px, 43vw);
}
#hud {
  position: absolute;
  top: 91px;
  left: clamp(20px, 5vw, 64px);
  width: min(295px, 60vw);
  padding: 13px 16px;
  border: 1px solid #fff1da4f;
  border-radius: 14px;
  background: #30243cd9;
  backdrop-filter: blur(10px);
  z-index: 2;
}
.hud-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 13px;
  font-size: 12px;
}
#score {
  color: #f9d699;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
progress {
  display: block;
  appearance: none;
  border: 0;
  height: 5px;
  width: 100%;
  margin-top: 8px;
  border-radius: 6px;
  overflow: hidden;
  background: #ffffff25;
}
progress::-webkit-progress-bar {
  background: #ffffff25;
}
progress::-webkit-progress-value {
  background: linear-gradient(90deg, #b6a0e7, #f4d19d);
  border-radius: 6px;
}
progress::-moz-progress-bar {
  background: #dab8f2;
}
#health {
  margin-top: 8px;
  color: #f3b3b4;
  letter-spacing: 0.15em;
  font-size: 13px;
}
#enemy-health {
  position: absolute;
  top: 91px;
  right: clamp(20px, 5vw, 64px);
  width: min(240px, 29vw);
  text-align: right;
  background: #30243ccb;
  padding: 12px 15px;
  border: 1px solid #f4b7c63c;
  border-radius: 14px;
  font-size: 12px;
  z-index: 2;
}
#enemy-health progress::-webkit-progress-value {
  background: linear-gradient(90deg, #b86c8d, #f5a79e);
}
#instructions {
  position: absolute;
  bottom: 25px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.025em;
  color: #fff0d4;
  text-shadow: 0 2px 5px #121224;
  pointer-events: none;
}
kbd {
  border: 1px solid #ffefcb71;
  background: #30273c97;
  border-radius: 4px;
  padding: 3px 5px;
  font:
    600 11px "DM Sans",
    sans-serif;
}
#toast {
  position: absolute;
  left: 50%;
  top: 35%;
  transform: translateX(-50%);
  z-index: 3;
  pointer-events: none;
  border: 1px solid #ffe0ae64;
  border-radius: 26px;
  padding: 10px 18px;
  background: #32253bdf;
  text-align: center;
  max-width: 90%;
  font-size: 14px;
  box-shadow: 0 3px 20px #2115245c;
}
#reticle {
  position: absolute;
  left: 50%;
  top: 44%;
  transform: translate(-50%, -50%);
  font: 300 40px/1 sans-serif;
  color: #fff4e2a3;
  pointer-events: none;
}
#target-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}
.target {
  position: absolute;
  transform: translate(-50%, -50%);
  border: 2px solid #ffe2ba;
  border-radius: 50%;
  background: #923a5245;
  box-shadow:
    0 0 0 6px #d5878c3a,
    0 0 22px #30233d44;
  pointer-events: auto;
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  font-size: 20px;
  touch-action: manipulation;
}
.target:hover {
  background: #de6d6e70;
  box-shadow: 0 0 0 7px #ffe1b54d;
}
.target span {
  position: absolute;
  bottom: -23px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  background: #402c3cbd;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
#touch {
  position: absolute;
  z-index: 3;
  bottom: 22px;
  left: 20px;
  right: 20px;
  display: none;
  align-items: flex-end;
  justify-content: space-between;
  pointer-events: none;
}
.dpad {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.dpad > div {
  display: flex;
  gap: 5px;
}
.dpad button,
#action {
  pointer-events: auto;
  touch-action: none;
  border: 1px solid #ffe7c66b;
  background: #35253ecb;
  backdrop-filter: blur(10px);
}
.dpad button {
  width: 46px;
  height: 44px;
  border-radius: 13px;
  font-size: 23px;
}
#action {
  border-radius: 50%;
  width: 88px;
  height: 88px;
  background: #efcf9be0;
  color: #35233a;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 7px 24px #18122d55;
  padding: 10px;
}
@media (pointer: coarse), (max-width: 680px) {
  #dodge {
    pointer-events: auto;
    touch-action: manipulation;
    align-self: flex-end;
    margin: 0 8px 12px;
    border: 1px solid #ffdfb55c;
    border-radius: 25px;
    background: #35253edb;
    padding: 12px 13px;
    font-size: 12px;
    color: #ffe6bd;
  }
}
#game[data-mode="shoot"] .dpad,
#game[data-mode="shoot"] #action {
  display: none;
}
#eyelids {
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}
#eyelids div {
  background: #080a10;
  flex: 1;
  transition: transform 1.8s cubic-bezier(0.47, 0, 0.18, 1);
}
#eyelids:not(.shut) div:first-child {
  transform: translateY(-102%);
}
#eyelids:not(.shut) div:last-child {
  transform: translateY(102%);
}
#game[data-mode="opening"] #eyelids {
  z-index: 1;
}
#game[data-mode="opening"] .wordmark {
  opacity: 0;
}
#flash {
  z-index: 5;
  pointer-events: none;
  opacity: 0;
  background: #ffe0a5;
  transition: opacity 0.15s;
}
#fade {
  z-index: 10;
  background: #292238;
  opacity: 0;
  transition: opacity 0.32s;
  pointer-events: none;
}
#fade.active {
  opacity: 1;
}
#curtain {
  z-index: 8;
  pointer-events: none;
  overflow: hidden;
}
.curtain-half {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 51%;
  background: repeating-linear-gradient(
    90deg,
    #47152d 0%,
    #8d2949 9%,
    #c05064 15%,
    #6a1d39 22%,
    #49142c 28%
  );
  transition: transform 2.3s cubic-bezier(0.43, 0.02, 0.27, 0.99);
  box-shadow: inset 0 -50px 70px #27091f;
}
.curtain-half::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(90deg, #bb8b49, #ffdc8c, #90613c);
}
.curtain-half.left {
  left: 0;
  transform: translateX(-103%);
}
.curtain-half.right {
  right: 0;
  transform: translateX(103%);
}
#curtain.closed .curtain-half {
  transform: translateX(0);
}
#curtain-message {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: auto;
  text-shadow: 0 4px 20px #350d2b;
}
#curtain-message p {
  letter-spacing: 0.28em;
  font-size: 13px;
  color: #ffe0a6;
}
#curtain-message h2 {
  font: 400 clamp(42px, 8vw, 90px)/1 var(--serif);
  letter-spacing: -0.04em;
  margin: 4px 0 30px;
}
@media (pointer: coarse), (max-width: 680px) {
  #touch:not([hidden]) {
    display: flex;
  }
  #instructions {
    bottom: 131px;
    font-size: 11px;
    padding: 0 18px;
  }
  #dialog {
    padding: 19px 21px 21px;
    width: calc(100% - 32px);
    bottom: 24px;
  }
  #hud {
    top: 75px;
    left: 18px;
    padding: 11px 13px;
  }
  #enemy-health {
    top: 75px;
    right: 18px;
    padding: 11px;
    width: 28vw;
  }
  header {
    padding: 18px;
  }
  .wordmark {
    font-size: 18px;
  }
  #game[data-mode="proposal"] #dialog {
    left: 16px;
    width: calc(100% - 32px);
    max-height: 53%;
    overflow: auto;
  }
  #game[data-mode="proposal"] h1 {
    font-size: 21px;
  }
  .target {
    width: 57px;
    height: 57px;
  }
  #choices {
    margin-top: 16px;
  }
  #choices button {
    font-size: 13px;
    padding: 10px 15px;
  }
}
@media (max-height: 480px) {
  header {
    padding: 12px 20px;
  }
  #hud,
  #enemy-health {
    top: 62px;
  }
  #dialog {
    bottom: 15px;
    padding: 15px 20px;
  }
  h1 {
    font-size: 22px;
  }
  #choices {
    margin-top: 13px;
  }
  #detail {
    margin-top: 9px;
    font-size: 12px;
  }
  #game[data-mode="proposal"] #dialog {
    max-height: calc(100% - 30px);
    overflow: auto;
  }
  #instructions {
    bottom: 15px;
  }
  #toast {
    top: 29%;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: 0.01s !important;
    animation-duration: 0.01s !important;
  }
}

      <div id="fade" aria-hidden="true"></div>
