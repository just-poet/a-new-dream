<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#27223d" />
    <title>A New Dream</title>
    <style>
      /*STYLE*/
    </style>
  </head>
  <body>
    <main id="game" data-mode="opening">
      <div id="viewport" aria-label="Rapunzel’s 3D adventure"></div>
      <div class="vignette" aria-hidden="true"></div>
      <header>
        <span class="wordmark">A new dream</span>
        <div class="tools">
          <button
            type="button"
            id="sound"
            aria-label="Mute sound"
            aria-pressed="true"
          >
            ♫
          </button>
          <button type="button" id="pause" aria-label="Pause" hidden>Ⅱ</button>
        </div>
      </header>
      <div id="hud" hidden>
        <div class="hud-row">
          <span id="objective"></span><span id="score"></span>
        </div>
        <progress
          id="progress"
          max="7"
          value="7"
          aria-label="Objective progress"
        ></progress>
        <div id="health" hidden></div>
      </div>
      <div id="enemy-health" hidden>
        <span>Mother Gothel</span
        ><progress
          max="7"
          value="7"
          id="gothel-health"
          aria-label="Mother Gothel health"
        ></progress>
      </div>
      <div id="target-layer" aria-label="Enemies"></div>
      <div id="reticle" aria-hidden="true" hidden>+</div>
      <div id="toast" aria-live="polite" hidden></div>
      <div id="instructions" hidden></div>
      <section id="dialog" role="region" aria-labelledby="line">
        <div id="speaker"></div>
        <h1 id="line">A new dream</h1>
        <p id="detail">Wake up, princess.</p>
        <div id="choices"></div>
      </section>
      <div id="touch" hidden>
        <div class="dpad">
          <button data-key="KeyW" aria-label="Move forward">↑</button>
          <div>
            <button data-key="KeyA" aria-label="Move left">←</button
            ><button data-key="KeyS" aria-label="Move backward">↓</button
            ><button data-key="KeyD" aria-label="Move right">→</button>
          </div>
        </div>
        <button id="dodge" type="button">Dodge</button
        ><button id="action" type="button">Swing pan</button>
      </div>
      <div id="flash" aria-hidden="true"></div>
      <div id="eyelids" aria-hidden="true" class="shut">
        <div></div>
        <div></div>
      </div>
      <div id="curtain" aria-hidden="true">
        <div class="curtain-half left"></div>
        <div class="curtain-half right"></div>
        <div id="curtain-message" hidden>
          <p>HAPPY ENDING</p>
          <h2>A new dream.</h2>
          <button id="replay" type="button">Play again</button>
        </div>
      </div>
      <div id="fade" aria-hidden="true"></div>
    </main>
    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
